<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | GardenLab</title>

    <link rel="stylesheet" href="../CSS/main.css">

</head>

<body class="auth-page">

    <main class="auth-container">

        <a href="index.html" class="logo auth-logo">
            <span class="logo-icon">✦</span>
            Garden<span>Lab</span>
        </a>


        <div class="auth-card">

            <span class="section-tag">
                COMEÇAR
            </span>

            <h1>
                Criar sua conta
            </h1>

            <p>
                Faça seu cadastro para utilizar o GardenLab.
            </p>


            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Seu nome"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Crie uma senha"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Digite novamente"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary btn-full"
                >
                    Criar conta
                </button>

            </form>


            <p class="auth-footer">

                Já possui uma conta?

                <a href="login.html">
                    Entrar
                </a>

            </p>

        </div>

    </main>


    <script src="../Java Script/main.js"></script>

</body>

</html>
